<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Foodie Hub - Trial Menu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%); color: #333; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background: #ffffff; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 25px; background: linear-gradient(135deg, #ff416c, #ff4b2b); padding: 20px; border-radius: 15px; color: white; }
        .header h1 { font-size: 26px; font-weight: 700; }
        .header p { font-size: 13px; opacity: 0.9; margin-top: 5px; font-style: italic; }
        .section-title { font-size: 16px; font-weight: 700; margin: 20px 0 10px 0; color: #ff4b2b; text-transform: uppercase; }
        .menu-card { background: #fffbfb; border: 1px solid #ffebeb; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .menu-item { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .menu-price { color: #27ae60; background: #e8f8f0; padding: 2px 8px; border-radius: 20px; font-size: 13px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 10px; background: #fcfcfc; }
        .btn-whatsapp { width: 100%; background: linear-gradient(135deg, #25D366, #1ebd58); color: white; border: none; padding: 15px; font-size: 16px; font-weight: 600; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍔 The Foodie Hub</h1>
            <p>✨ Testing our awesome digital menu page</p>
        </div>
        <div class="section-title">⚡ Fast Food</div>
        <div class="menu-card">
            <div class="menu-item"><span>🍔 Cheese Lava Burger</span><span class="menu-price">Rs 180</span></div>
            <div class="menu-item"><span>🍕 Pizza Pepperoni</span><span class="menu-price">Rs 250</span></div>
        </div>
        <div class="section-title">🛒 Place Your Trial Order</div>
        <div class="form-group"><input type="text" placeholder="Full Name" id="customer-name" required></div>
        <div class="form-group"><input type="text" placeholder="Your Order" id="customer-order" required></div>
        <div class="form-group"><input type="text" placeholder="Delivery Address" id="customer-address" required></div>
        <button class="btn-whatsapp" onclick="sendOrder()">💬 Send Test Order via WhatsApp</button>
    </div>
    <script>
        function sendOrder() {
            var phoneNumber = "923123103603"; 
            var name = document.getElementById('customer-name').value;
            var order = document.getElementById('customer-order').value;
            var address = document.getElementById('customer-address').value;
            
            if(name === "" || order === "" || address === "") {
                alert("Please fill all fields to test the order!");
                return;
            }
            
            var message = "*🔥 NEW TRIAL ORDER!*\n\n" + "👤 *Customer Name:* " + name + "\n" + "🍔 *Items Ordered:* " + order + "\n" + "📍 *Delivery Address:* " + address;
            
            // Sabse safe format jo har mobile app aur browser me automatic chalta hai
            var finalUrl = "https://wa.me/" + phoneNumber + "?text=" + encodeURIComponent(message);
            window.open(finalUrl, '_blank');
        }
    </script>
</body>
</html>
